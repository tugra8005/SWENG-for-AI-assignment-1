[project]
name = "mesveret"
version = "0.1.0"
description = "Meşveret — oylamayla yönetilen forum (API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "typer>=0.12",
    "tzdata>=2024.1",
    "pillow>=11",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
]

[project.scripts]
"meşveret-dev" = "mesveret.cli:main"
"mesveret-dev" = "mesveret.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesveret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
markers = ["integration: PostgreSQL ve Neo4j test yığını gerektirir"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
