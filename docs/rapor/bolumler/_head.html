<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Meşveret — Analiz, Tasarım ve Politikalar</title>
<style>
@font-face { font-family: 'Newsreader'; src: url('../../client/node_modules/@expo-google-fonts/newsreader/400Regular/Newsreader_400Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'Newsreader'; src: url('../../client/node_modules/@expo-google-fonts/newsreader/400Regular_Italic/Newsreader_400Regular_Italic.ttf'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'Newsreader'; src: url('../../client/node_modules/@expo-google-fonts/newsreader/600SemiBold/Newsreader_600SemiBold.ttf'); font-weight: 600; }
@font-face { font-family: 'Newsreader'; src: url('../../client/node_modules/@expo-google-fonts/newsreader/600SemiBold_Italic/Newsreader_600SemiBold_Italic.ttf'); font-weight: 600; font-style: italic; }
@font-face { font-family: 'Newsreader'; src: url('../../client/node_modules/@expo-google-fonts/newsreader/800ExtraBold/Newsreader_800ExtraBold.ttf'); font-weight: 800; }
@font-face { font-family: 'Plex Mono'; src: url('../../client/node_modules/@expo-google-fonts/ibm-plex-mono/400Regular/IBMPlexMono_400Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'Plex Mono'; src: url('../../client/node_modules/@expo-google-fonts/ibm-plex-mono/500Medium/IBMPlexMono_500Medium.ttf'); font-weight: 500; }

@page { size: A4; margin: 17mm 17mm 18mm 17mm; }
:root { --ink: #1B1A17; --soft: #4A463E; --muted: #6B6558; --hair: #CFC6B3; --seal: #7A1E2B; --wash: #F4EFE4; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Newsreader', serif; font-size: 10.6pt; line-height: 1.42; color: var(--ink); background: #fff; }
p { margin: 0 0 6pt; }
h1, h2, h3 { font-family: 'Newsreader', serif; color: var(--ink); }
h2 { font-weight: 800; font-size: 17pt; margin: 0 0 4pt; padding-top: 2pt; border-bottom: 2.2pt double var(--ink); padding-bottom: 3pt; break-after: avoid; }
h2 .no { font-family: 'Plex Mono', monospace; font-weight: 500; font-size: 10pt; color: var(--seal); margin-right: 6pt; vertical-align: 3pt; }
h3 { font-weight: 600; font-size: 12pt; margin: 10pt 0 3pt; break-after: avoid; }
.lead { font-size: 11.6pt; line-height: 1.4; margin: 6pt 0 8pt; }
.kicker { font-family: 'Plex Mono', monospace; font-size: 7.6pt; letter-spacing: 0.9pt; text-transform: uppercase; color: var(--muted); }
section { margin-bottom: 14pt; }
.newpage { break-before: page; }
ul, ol { margin: 0 0 7pt; padding-left: 15pt; }
li { margin-bottom: 2pt; }
b, strong { font-weight: 600; }
code, .mono { font-family: 'Plex Mono', monospace; font-size: 8.6pt; }
table { width: 100%; border-collapse: collapse; margin: 4pt 0 9pt; font-size: 9.2pt; line-height: 1.3; break-inside: auto; }
thead { display: table-header-group; }
tr { break-inside: avoid; }
th { font-family: 'Plex Mono', monospace; font-weight: 500; font-size: 7.4pt; letter-spacing: 0.5pt; text-transform: uppercase; text-align: left; color: var(--soft); border-bottom: 1pt solid var(--ink); padding: 3pt 5pt 3pt 0; vertical-align: bottom; }
td { border-bottom: 0.5pt solid var(--hair); padding: 3.5pt 5pt 3.5pt 0; vertical-align: top; }
td.k { font-family: 'Plex Mono', monospace; font-size: 8.2pt; white-space: nowrap; color: var(--seal); }
td.c { text-align: center; }
.yes { color: #2F4A2A; font-weight: 600; }
.no-x { color: var(--seal); font-weight: 600; }
figure { margin: 8pt 0 10pt; break-inside: avoid; }
figure img { display: block; width: 100%; border: 0.6pt solid var(--ink); }
figure.narrow img { width: 72%; margin: 0 auto; }
figure.half img { width: 58%; margin: 0 auto; }
figcaption { font-size: 8.8pt; line-height: 1.35; color: var(--soft); margin-top: 4pt; font-style: italic; }
figcaption b { font-style: normal; font-family: 'Plex Mono', monospace; font-weight: 500; font-size: 7.8pt; color: var(--seal); letter-spacing: 0.4pt; margin-right: 3pt; }
.side { display: flex; gap: 12pt; align-items: flex-start; break-inside: avoid; }
.side > div { flex: 1; }
.side figure { flex: 0 0 34%; margin-top: 2pt; }
.box { border: 0.8pt solid var(--ink); background: #FAF7F0; padding: 6pt 9pt; margin: 6pt 0 10pt; break-inside: avoid; }
.box .kicker { color: var(--seal); display: block; margin-bottom: 2pt; }
.box p:last-child { margin-bottom: 0; }
svg { display: block; width: 100%; height: auto; margin: 4pt 0 2pt; }
svg text { font-family: 'Newsreader', serif; }
svg .m { font-family: 'Plex Mono', monospace; }
/* UML ve diğer diyagramlar (diyagramlar.py): genişlik olustur.py'de, ölçek korunarak verilir. */
figure.uml .umlbox { margin: 0 auto; }
figure.uml svg.uml { margin: 0; width: 100%; height: auto; }
figure.uml figcaption { margin-top: 6pt; }

/* kapak */
.cover { height: 258mm; display: flex; flex-direction: column; break-after: page; }
.cover .top { display: flex; justify-content: space-between; font-family: 'Plex Mono', monospace; font-size: 8.4pt; letter-spacing: 1.2pt; text-transform: uppercase; color: var(--ink); border-bottom: 2.4pt double var(--ink); padding-bottom: 4pt; }
.cover .course { text-align: center; font-family: 'Plex Mono', monospace; font-size: 8pt; letter-spacing: 1pt; text-transform: uppercase; color: var(--soft); margin-top: 3mm; }
.cover .mast { text-align: center; margin-top: 26mm; }
.cover .mast img { width: 28mm; }
.cover .mast .name { font-weight: 800; font-size: 50pt; letter-spacing: 6pt; line-height: 1; margin-top: 6mm; }
.cover .mast .tag { font-style: italic; color: var(--soft); font-size: 12pt; margin-top: 3mm; }
.cover .title { text-align: center; margin-top: 18mm; border-top: 1pt solid var(--ink); border-bottom: 1pt solid var(--ink); padding: 7mm 0; }
.cover .title .t { font-weight: 800; font-size: 25pt; line-height: 1.15; }
.cover .title .s { font-size: 12pt; color: var(--soft); margin-top: 3mm; line-height: 1.4; }
.cover .author { text-align: center; margin-top: 22mm; }
.cover .author .kicker { display: block; margin-bottom: 2mm; }
.cover .author .who { font-weight: 600; font-size: 19pt; line-height: 1.2; }
.cover .author .no { font-family: 'Plex Mono', monospace; font-size: 10.5pt; margin-top: 2mm; color: var(--soft); }
.cover .meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 10.5pt; border-top: 2.4pt double var(--ink); padding-top: 4mm; }
.cover .meta > div { flex: 1; }
.cover .meta .kicker { display: block; margin-bottom: 1mm; }
.tocpage { break-after: page; }
.tocpage h2 { margin-bottom: 8pt; }
.tocpage .toc { columns: 1; font-size: 10pt; line-height: 1.3; margin-top: 6pt; }
.tocpage .toc div { padding: 1.2pt 0; }
.tocpage .toc span { width: 26pt; font-size: 9pt; }
.tocpage .toc .part { margin-top: 7pt; }
.toc { columns: 2; column-gap: 14mm; font-size: 9.6pt; margin-top: 3pt; }
.toc div { break-inside: avoid; padding: 1.2pt 0; border-bottom: 0.4pt dotted var(--hair); }
.toc span { font-family: 'Plex Mono', monospace; font-size: 8pt; color: var(--seal); display: inline-block; width: 18pt; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1pt solid var(--ink); border-bottom: 1pt solid var(--ink); margin: 8pt 0 10pt; }
.stats div { padding: 5pt 6pt; border-left: 0.5pt solid var(--hair); }
.stats div:first-child { border-left: 0; padding-left: 0; }
.stats .n { font-weight: 800; font-size: 18pt; line-height: 1.05; }
.stats .l { font-size: 8.4pt; color: var(--soft); line-height: 1.25; }

/* sayısal tablolar */
table.num td.n, table.num th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: 'Plex Mono', monospace; font-size: 8.4pt; padding-left: 6pt; }
table.num th { text-align: right; padding-left: 6pt; }
table.num th:first-child { text-align: left; padding-left: 0; }
table.num tr.best td { background: #EEF0E6; }
table.num tr.best td:first-child { font-weight: 600; }
td.sub { font-family: 'Plex Mono', monospace; font-size: 7.4pt; letter-spacing: 0.6pt; text-transform: uppercase; color: var(--seal); padding-top: 7pt; border-bottom: 0.8pt solid var(--ink); }
.bar { height: 7pt; background: var(--wash); border: 0.4pt solid var(--hair); margin-top: 2pt; }
.bar span { display: block; height: 100%; }
table.grid td, table.grid th { text-align: center; }
table.grid tbody th { text-align: left; border-bottom: 0.5pt solid var(--hair); }
table.grid td { font-family: 'Plex Mono', monospace; font-size: 8.4pt; }
table.grid td.cur { outline: 1.2pt solid var(--seal); outline-offset: -2pt; font-weight: 500; color: var(--seal); }
table.cm { width: auto; margin: 4pt 0 8pt; }
table.cm th, table.cm td { padding: 5pt 10pt; border: 0.6pt solid var(--ink); text-align: center; }
table.cm thead th { border-top: 0; border-left: 0; border-right: 0; }
table.cm tbody th { text-align: left; border-left: 0; }
table.cm td { font-family: 'Plex Mono', monospace; font-size: 9pt; }
.note { font-size: 9pt; line-height: 1.38; color: var(--soft); margin: 2pt 0 8pt; }
.box .note { margin-bottom: 0; }

/* kanvas */
table.canvas { border: 1pt solid var(--ink); table-layout: fixed; }
table.canvas td { width: 50%; padding: 5pt 8pt 6pt; border: 0.6pt solid var(--ink); font-size: 9.4pt; line-height: 1.33; }
table.canvas .kicker { display: block; color: var(--seal); margin-bottom: 2pt; }

/* kod */
pre { font-family: 'Plex Mono', monospace; font-size: 7.6pt; line-height: 1.38; background: #FAF7F0; border: 0.6pt solid var(--hair); padding: 5pt 7pt; margin: 3pt 0 6pt; white-space: pre; overflow: hidden; }
.side.code2 { display: block; }
.code2 > div { margin-bottom: 4pt; }
.code2 .kicker { display: block; margin-bottom: 2pt; }

/* bölüm başlıkları */
.partHead { break-before: page; font-family: 'Newsreader', serif; font-weight: 800; font-size: 26pt; line-height: 1.1; border-top: 2.4pt double var(--ink); border-bottom: 1pt solid var(--ink); padding: 5mm 0 4mm; margin: 0 0 7mm; }
.partHead span { display: block; font-family: 'Plex Mono', monospace; font-weight: 500; font-size: 8pt; letter-spacing: 1.2pt; text-transform: uppercase; color: var(--seal); margin-bottom: 2mm; }
.partHead + section { break-before: auto; }
.toc .part { font-weight: 600; border-bottom: 0.8pt solid var(--ink); margin-top: 4pt; }
.toc .part span { color: var(--ink); }

/* kaynakça */
ul.refs { list-style: none; padding-left: 0; }
ul.refs li { padding-left: 16pt; text-indent: -16pt; margin-bottom: 4pt; }
</style>
